baseURL: "https://pauhidalgoo.github.io/"
title: "Pau Hidalgo Pujol"
theme: "PaperMod"
locale: "en"
defaultContentLanguage: "en"
enableRobotsTXT: true
enableGitInfo: true
pagination:
  pagerSize: 10

permalinks:
  writing: "/writing/:slug/"
  research: "/research/:slug/"
  projects: "/projects/:slug/"

taxonomies:
  tag: "tags"
  category: "categories"

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: true
  tableOfContents:
    startLevel: 2
    endLevel: 3
    ordered: false

outputs:
  home:
    - HTML
    - RSS
    - JSON

menu:
  main:
    - name: "Writing"
      pageRef: "/writing"
      weight: 10
    - name: "Research"
      pageRef: "/research"
      weight: 20
    - name: "Projects"
      pageRef: "/projects"
      weight: 30
    - name: "Archive"
      pageRef: "/archive"
      weight: 40
    - name: "About"
      pageRef: "/about"
      weight: 50
    - name: "Search"
      pageRef: "/search"
      weight: 60

params:
  env: "production"
  description: "Personal research website and technical writing archive for Pau Hidalgo Pujol."
  author: "Pau Hidalgo Pujol"
  tagline: "Machine learning research, from Barcelona."
  defaultTheme: "light"
  disableThemeToggle: true
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  mainSections:
    - "writing"
  assets:
    disableHLJS: true
    favicon: "/favicon.svg"
    
  socialIcons:
    - name: "github"
      url: "https://github.com/pauhidalgoo"
    - name: "huggingface"
      url: "https://huggingface.co/pauhidalgoo"
    - name: "email"
      url: "mailto:pauhidalgopujol@gmail.com"
    - name: "linkedin"
      url: "https://www.linkedin.com/in/pau-hidalgo-pujol-184388269/"

privacy:
  x:
    disabled: true
  instagram:
    disabled: true
  youtube:
    privacyEnhanced: true
