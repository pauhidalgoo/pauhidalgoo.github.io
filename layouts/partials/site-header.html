<header class="site-header">
  <div class="site-nav">
    <a class="wordmark" href="/" aria-label="Pau Hidalgo Pujol, home">
      <span>Pau Hidalgo Pujol</span>
      <small>Research notebook</small>
    </a>
    <div class="nav-controls">
      <nav id="site-menu" aria-label="Primary navigation">
        {{ $current := . }}
        {{ range site.Menus.main }}
          <a href="{{ .URL }}" class="{{ if eq .Name "Search" }}search-nav{{ end }}" {{ if $current.IsMenuCurrent "main" . }}aria-current="page"{{ end }}>
            {{ if eq .Name "Search" }}<span aria-hidden="true">⌕</span>{{ end }}{{ .Name }}
          </a>
        {{ end }}
      </nav>
      <button class="theme-toggle" type="button" aria-label="Use dark mode" title="Change colour theme">
        <svg class="theme-icon--sun" aria-hidden="true" viewBox="0 0 20 20">
          <circle cx="10" cy="10" r="3.2" fill="currentColor"/>
          <path d="M10 1v2M10 17v2M1 10h2M17 10h2M3.6 3.6L5 5M15 15l1.4 1.4M16.4 3.6L15 5M5 15l-1.4 1.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <svg class="theme-icon--moon" aria-hidden="true" viewBox="0 0 20 20">
          <path d="M15.8 13.2A6.8 6.8 0 016.9 4.3a6.8 6.8 0 108.9 8.9z" fill="currentColor"/>
        </svg>
      </button>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu">
        <span>Menu</span><i aria-hidden="true"></i>
      </button>
    </div>
  </div>
</header>
